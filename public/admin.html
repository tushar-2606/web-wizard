<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; background: #F5F7FA; padding: 2rem; }
.card { padding: 2rem; border-radius: 1.5rem; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
.table { background: #fff; border-radius: 1rem; overflow: hidden; }
.table thead { background: #4682B4; color: #fff; }
.badge-confirmed { background-color: #2E7D32; }
.badge-waiting { background-color: #FFD700; color:#000; }
.btn-success { border-radius: 1rem; }
.pagination .page-link { border-radius: 0.5rem; }
</style>
</head>
<body>

<div class="card">
  <div class="d-flex justify-content-between align-items-center flex-wrap mb-3">
    <input type="text" id="searchBox" class="form-control w-auto mb-2" placeholder="Search name/email">
    <a href="/admin/export" class="btn btn-success mb-2">Export CSV</a>
  </div>

  <table class="table table-striped table-hover">
    <thead>
      <tr><th>Name</th><th>Email</th><th>Status</th></tr>
    </thead>
    <tbody id="regTable"></tbody>
  </table>

  <nav class="d-flex justify-content-center mt-3">
    <ul class="pagination" id="pagination"></ul>
  </nav>
</div>

<script>
async function loadRegs(page=1, search="") {
  try {
    const res = await fetch(`/admin/registrations?page=${page}&search=${search}`);
    if (!res.ok) throw new Error(`Error: ${res.status} ${res.statusText}`);
    const data = await res.json();
    const tbody = document.getElementById("regTable");
    tbody.innerHTML = data.regs.map(r => 
      `<tr>
        <td>${r.name}</td>
        <td>${r.email}</td>
        <td><span class="badge ${r.status==='confirmed'?'badge-confirmed':'badge-waiting'}">${r.status}</span></td>
      </tr>`).join("");

    const pagination = document.getElementById("pagination");
    pagination.innerHTML = "";
    for (let i=1; i<=data.pages; i++) {
      pagination.innerHTML += `<li class="page-item ${i===data.page?'active':''}">
        <a class="page-link" onclick="loadRegs(${i},'${search}')">${i}</a></li>`;
    }
  } catch (error) {
    console.error("Failed to load registrations:", error);
    alert("Failed to load registrations. Please try again later.");
  }
}

document.getElementById("searchBox").addEventListener("input", e => loadRegs(1, e.target.value));
loadRegs();
</script>
</body>
</html>
