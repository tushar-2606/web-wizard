<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register for Event</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Inter', sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #EAF6FF, #D0EFFF);
  }
  .card {
    padding: 2rem;
    border-radius: 1.5rem;
    max-width: 450px;
    width: 100%;
    box-shadow: 0 15px 40px rgba(0,0,0,0.1);
  }
  .form-control {
    border-radius: 1rem;
    transition: all 0.3s;
  }
  .form-control:focus {
    border-color: #4682B4;
    box-shadow: 0 0 5px rgba(70,130,180,0.3);
  }
  .btn-primary {
    background-color: #4682B4;
    border-radius: 1rem;
    font-weight: 600;
    padding: 0.6rem 1.2rem;
  }
  .btn-primary:hover {
    background-color: #35608D;
  }
  h2 {
    font-weight: 700;
    text-align: center;
    margin-bottom: 1.5rem;
    color: #2E7D32;
  }
  .toast-container {
    position: fixed;
    top: 1rem;
    right: 1rem;
    z-index: 1055;
  }
</style>
</head>
<body>

<div class="card">
  <h2>Register for Event</h2>
  <form id="regForm" class="needs-validation" novalidate>
    <div class="mb-3">
      <input type="text" class="form-control" id="name" placeholder="Full Name" required minlength="3">
      <div class="invalid-feedback">Name must be at least 3 characters.</div>
    </div>
    <div class="mb-3">
      <input type="email" class="form-control" id="email" placeholder="Email Address" required>
      <div class="invalid-feedback">Enter a valid email.</div>
    </div>
    <button type="submit" class="btn btn-primary w-100">Register</button>
  </form>
</div>

<div class="toast-container">
  <div id="liveToast" class="toast align-items-center border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toastMsg"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const form = document.getElementById("regForm");
form.addEventListener("submit", async e => {
  e.preventDefault();
  if (!form.checkValidity()) {
    e.stopPropagation();
    form.classList.add("was-validated");
    return;
  }
  const data = { name: form.name.value, email: form.email.value };
  const res = await fetch("/register", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  });
  const result = await res.json();
  showToast(result.message, result.success);
});

function showToast(message, success) {
  const toastEl = document.getElementById("liveToast");
  const toastMsg = document.getElementById("toastMsg");
  toastMsg.textContent = message;
  toastEl.classList.toggle("text-bg-success", success);
  toastEl.classList.toggle("text-bg-danger", !success);
  new bootstrap.Toast(toastEl).show();
}
</script>
</body>
</html>
