<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Event Registration</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h1 class="mb-4">Available Events</h1>
    <div id="events" class="row gy-4"></div>
  </div>

  <!-- Registration modal -->
  <div class="modal fade" id="regModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form id="regForm" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Register</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="eventId">
          <div class="mb-3">
            <label class="form-label">Name</label>
            <input id="name" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input id="email" type="email" class="form-control" required>
          </div>
          <div id="regMsg" class="small text-muted"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-primary">Register</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/register.js"></script>
</body>
</html>
