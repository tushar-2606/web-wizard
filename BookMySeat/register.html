<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BookMySeat | Student Registration</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="container" role="main" aria-labelledby="registerTitle">

  <div class="logo" aria-label="BookMySeat logo" role="img">
    <svg 
      xmlns="http://www.w3.org/2000/svg" 
      viewBox="0 0 240 60" 
      preserveAspectRatio="xMidYMid meet" 
      width="180" 
      height="50" 
      role="img" 
      aria-hidden="true"
    >
      <text
        x="10"
        y="40"
        font-family="Montserrat, sans-serif"
        font-size="36"
        font-weight="700"
        fill="#0052cc"
        letter-spacing="2"
      >
        BookMySeat
      </text>
      <rect
        x="220"
        y="15"
        width="12"
        height="30"
        rx="6"
        ry="6"
        fill="#0052cc"
      />
    </svg>
  </div>

  <h1 id="registerTitle">Student Registration</h1>

  <form id="registerForm" novalidate>
    <label for="name">Your Full Name</label>
    <input type="text" id="name" name="name" placeholder="John Doe" required />

    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />

    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="Create a password" autocomplete="new-password" required />

    <label for="confirmPassword">Confirm Password</label>
    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" autocomplete="new-password" required />

    <button type="submit">Register</button>
  </form>

  <div id="registerMessage" class="message" style="display:none;"></div>

  <div class="nav-link" id="goToLogin">Already have an account? Login here</div>
</div>

<script src="register.js"></script>

</body>
</html>
