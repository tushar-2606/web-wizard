<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BookMySeat | Admin Panel</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="container" role="main" aria-labelledby="adminPanelTitle">

  <div class="logo" aria-label="BookMySeat logo" role="img">
    <svg 
      xmlns="http://www.w3.org/2000/svg" 
      viewBox="0 0 240 60" 
      preserveAspectRatio="xMidYMid meet" 
      width="180" 
      height="50" 
      role="img" 
      aria-hidden="true"
    >
      <text
        x="10"
        y="40"
        font-family="Montserrat, sans-serif"
        font-size="36"
        font-weight="700"
        fill="#0052cc"
        letter-spacing="2"
      >
        BookMySeat
      </text>
      <rect
        x="220"
        y="15"
        width="12"
        height="30"
        rx="6"
        ry="6"
        fill="#0052cc"
      />
    </svg>
  </div>

  <h1 id="adminPanelTitle">Admin Panel - Event Registrations</h1>

  <button id="logoutBtn" class="logout-btn" aria-label="Logout from Admin Panel">Logout</button>

  <main id="eventsContainer" aria-live="polite" style="margin-top: 2rem;"></main>
</div>

<script src="admin.js"></script>

</body>
</html>
