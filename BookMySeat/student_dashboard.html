<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BookMySeat | Student Dashboard</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="container" role="main" aria-labelledby="studentDashboardTitle">

  <div class="logo" aria-label="BookMySeat logo" role="img">
    <svg 
      xmlns="http://www.w3.org/2000/svg" 
      viewBox="0 0 240 60" 
      preserveAspectRatio="xMidYMid meet" 
      width="180" 
      height="50" 
      role="img" 
      aria-hidden="true"
    >
      <text
        x="10"
        y="40"
        font-family="Montserrat, sans-serif"
        font-size="36"
        font-weight="700"
        fill="#0052cc"
        letter-spacing="2"
      >
        BookMySeat
      </text>
      <rect
        x="220"
        y="15"
        width="12"
        height="30"
        rx="6"
        ry="6"
        fill="#0052cc"
      />
    </svg>
  </div>

  <h1 id="studentDashboardTitle">Welcome, <span id="studentNameDisplay"></span>!</h1>

  <button id="logoutBtn" class="logout-btn" aria-label="Logout">Logout</button>

  <div class="events-list" id="eventsListContainer">
    <h2>Available Events</h2>
    <div id="eventsList"></div>
  </div>
</div>

<!-- Registration Modal -->
<div id="registrationModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalDesc" style="display:none; position: fixed; z-index: 9999; padding-top: 100px; left: 0; top: 0; width: 100vw; height: 100vh; overflow: auto; background-color: rgba(0,0,0,0.4);">
  <div class="modal-content" style="background: #fff; margin: auto; border-radius: 10px; padding: 2rem; width: 360px; box-shadow: 0 8px 20px rgba(0,0,0,0.2); position: relative;">
    <button id="closeModalBtn" aria-label="Close" class="close-btn" style="position: absolute; top: 10px; right: 15px; background: none; border: none; font-size: 28px; color: #555; cursor: pointer;">&times;</button>
    <h2 id="modalTitle">Register for Event</h2>
    <p id="modalDesc" style="margin-bottom: 1.2rem;">Event details here</p>

    <button id="confirmRegisterBtn" class="register-btn" style="width: 100%; padding: 0.7rem; font-weight: 700; font-size: 1.1rem; cursor: pointer; background-color: #0052cc; color: white; border: none; border-radius: 8px;">Confirm Registration</button>
    <button id="cancelRegisterBtn" style="width: 100%; margin-top: 0.75rem; background: #ccc; color: #333; border: none; border-radius: 8px; padding: 0.7rem; cursor: pointer;">Cancel</button>

    <div id="modalMessage" class="message" style="display:none; margin-top: 1rem;"></div>
  </div>
</div>

<script src="student_dashboard.js"></script>

</body>
</html>
