<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BookMySeat | Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container" role="main" aria-labelledby="loginTitle">

    <div class="logo" aria-label="BookMySeat logo" role="img">
      <svg 
        xmlns="http://www.w3.org/2000/svg" 
        viewBox="0 0 240 60" 
        preserveAspectRatio="xMidYMid meet" 
        width="180" 
        height="50" 
        role="img" 
        aria-hidden="true"
      >
        <text
          x="10"
          y="40"
          font-family="Montserrat, sans-serif"
          font-size="36"
          font-weight="700"
          fill="#0052cc"
          letter-spacing="2"
        >
          BookMySeat
        </text>
        <rect
          x="220"
          y="15"
          width="12"
          height="30"
          rx="6"
          ry="6"
          fill="#0052cc"
        />
      </svg>
    </div>

    <h1 id="loginTitle">Login</h1>

    <form id="loginForm" novalidate>
      <label for="role">Select Role</label>
      <select id="role" name="role" required>
        <option value="" disabled selected>Select role</option>
        <option value="student">Student</option>
        <option value="admin">Admin</option>
      </select>

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="********" autocomplete="current-password" required />

      <button type="submit">Login</button>
    </form>

    <div id="loginMessage" class="message" style="display:none;"></div>

    <div class="nav-link" id="goToRegister">Don't have an account? Register here</div>
  </div>

  <script src="login.js"></script>

</body>
</html>
